    };
    const markBooked = async (email) => {
      try {
        await fetch('/api/lead', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'book-mark', email })
        });
      } catch (e) { console.error('book-mark error:', e); }
    };
    // Instant heads-up to Marina - fires when they reach Calendly, and again if they book.
    const notifyBookingLead = async ({ email, linkedin, booked }) => {
      try {
        await fetch('https://api.emailjs.com/api/v1.0/email/send', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            service_id: EMAIL_CONFIG.service_id, template_id: EMAIL_CONFIG.template_id, user_id: EMAIL_CONFIG.public_key,
            template_params: {
              to_email: EMAIL_CONFIG.notify_email,
              subject: booked ? `✅ AdRoast: ${email} BOOKED a call` : `📥 AdRoast: ${email} opened the calendar`,
              message: booked
                ? `${email} completed the form AND booked a call.\n\n🔗 LinkedIn: ${linkedin || '-'}`
                : `${email} gave their details and was sent to Calendly.\n\n🔗 LinkedIn: ${linkedin || '-'}\n\nIf they don't book, they'll get an automatic follow-up email (and you a reminder).`
            }
          })
        });
      } catch (e) { console.error('booking notify error:', e); }
    };

    function BookingFlow({ calendlyUrl }) {
      const [open, setOpen] = useState(false);
      const [email, setEmail] = useState('');
      const [linkedin, setLinkedin] = useState('');
      const [liLocked, setLiLocked] = useState(false); // true when LinkedIn came prefilled (results-page team review)
      const [phase, setPhase] = useState('form'); // 'form' | 'calendly'
      const [booked, setBooked] = useState(false);
      const emailRef = React.useRef(null);

      const loadCalendly = (em) => {
        const mount = () => {
          const el = document.getElementById('cal-embed');
          if (window.Calendly && el) {
            el.innerHTML = '';
            window.Calendly.initInlineWidget({
              url: calendlyUrl + '?hide_gdpr_banner=1&primary_color=0a66c2',
              parentElement: el,
              prefill: { email: (em || '').trim() }
            });
          }
        };
        if (window.Calendly) { setTimeout(mount, 40); return; }
        if (!document.getElementById('calendly-js')) {
          const s = document.createElement('script');
          s.id = 'calendly-js'; s.src = 'https://assets.calendly.com/assets/external/widget.js';
          s.onload = () => setTimeout(mount, 40);
          document.body.appendChild(s);
        } else { setTimeout(mount, 400); }
      };

      // Record the lead, notify Marina, and show Calendly. Values are passed
      // explicitly (state may not have flushed yet).
      const goCalendly = (em, li) => {
        const e = (em || '').trim(), l = (li || '').trim();
        recordBookingIntent({ email: e, linkedin: l });
        notifyBookingLead({ email: e, linkedin: l, booked: false });
        setPhase('calendly');
        loadCalendly(e);
      };

      useEffect(() => {
        // openBooking(prefill): reuse a known LinkedIn so we only ask for email.
        bookingBus.open = (prefill) => {
          const li = (prefill || '').trim();
          setBooked(false);
          setEmail('');
          setLinkedin(li);
          setLiLocked(isValidLinkedIn(li));
          setPhase('form');
          setOpen(true);
        };
        return () => { bookingBus.open = () => {}; };
      }, []);

      useEffect(() => { if (open) document.body.style.overflow = 'hidden'; else document.body.style.overflow = ''; return () => { document.body.style.overflow = ''; }; }, [open]);
      useEffect(() => { if (open && phase === 'form') setTimeout(() => emailRef.current && emailRef.current.focus(), 80); }, [open, phase]);

      // Watch for the Calendly booking confirmation (inline embed postMessage).
      useEffect(() => {
        if (!(open && phase === 'calendly')) return;
        const onMsg = (e) => {
          if (typeof e.origin === 'string' && e.origin.indexOf('calendly.com') === -1) return;
          if (e.data && e.data.event === 'calendly.event_scheduled') {
            setBooked(true);
            markBooked(email.trim());
            notifyBookingLead({ email: email.trim(), linkedin: linkedin.trim(), booked: true });
          }
        };
        window.addEventListener('message', onMsg);
        return () => window.removeEventListener('message', onMsg);
      }, [open, phase, email, linkedin]);

      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim());
      const liValid = isValidLinkedIn(linkedin);
      const canSubmit = emailValid && (liLocked || liValid);
      const close = () => setOpen(false);
      const submit = () => { if (canSubmit) goCalendly(email.trim(), linkedin.trim()); };

      if (!open) return null;

      return (
        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4" style={{ background: 'rgba(15,23,42,0.55)', backdropFilter: 'blur(3px)' }} onClick={close}>
          <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden" style={{ maxHeight: '92vh' }} onClick={e => e.stopPropagation()}>
            {phase === 'form' ? (
              <div className="p-6 sm:p-7">
                <div className="flex items-center justify-between mb-4">
                  <span className="text-xs font-bold uppercase tracking-wide" style={{ color: '#0a66c2' }}>Before we talk</span>
                  <button onClick={close} className="text-gray-300 hover:text-gray-500 bg-transparent border-none cursor-pointer text-2xl leading-none" aria-label="Close">×</button>
                </div>
                <div className="step-in">
                  <h3 className="text-gray-900 text-lg font-semibold mb-1">How can we reach you?</h3>
                  <p className="text-gray-400 text-sm mb-4">So we can send your recap, confirm the call, and follow up if you don't book. You'll pick a time next.</p>
                  <label className="block text-xs font-semibold text-gray-500 mb-1.5">Work email</label>
                  <input ref={emailRef} type="email" inputMode="email" autoComplete="email" placeholder="you@company.com" value={email}
                    onChange={e => setEmail(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') submit(); }}
                    className={`w-full px-4 py-3 border-2 rounded-xl text-sm focus:outline-none text-gray-900 ${email && !emailValid ? 'border-red-300' : email && emailValid ? 'border-green-400' : 'border-gray-200 focus:border-blue-500'}`} />
                  {email && !emailValid && <p className="text-red-400 text-xs mt-1.5">Enter a valid email so we can reach you.</p>}
                  {!liLocked && (<>
                    <label className="block text-xs font-semibold text-gray-500 mb-1.5 mt-4">LinkedIn profile</label>
                    <input type="url" inputMode="url" autoComplete="url" placeholder="https://linkedin.com/in/yourprofile" value={linkedin}
                      onChange={e => setLinkedin(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') submit(); }}
                      className={`w-full px-4 py-3 border-2 rounded-xl text-sm focus:outline-none text-gray-900 ${linkedin && !liValid ? 'border-red-300' : linkedin && liValid ? 'border-green-400' : 'border-gray-200 focus:border-blue-500'}`} />
                    {linkedin && !liValid && <p className="text-red-400 text-xs mt-1.5">Use your profile URL: linkedin.com/in/yourname</p>}
                    <p className="text-gray-400 text-xs mt-1.5">So we can see who you serve before the call.</p>
                  </>)}
                  {liLocked && <p className="text-green-600 text-xs mt-2 flex items-center gap-1"><Icon name="check" className="w-3 h-3" /> LinkedIn already on file</p>}
                  <button onClick={submit} disabled={!canSubmit} className="w-full mt-5 py-3 rounded-xl font-semibold text-sm transition-all border-none cursor-pointer"
                    style={canSubmit ? { background: '#0a66c2', color: '#fff' } : { background: '#e5e7eb', color: '#9ca3af', cursor: 'not-allowed' }}>Pick a time →</button>
                </div>
              </div>
            ) : (
              <div>
                <div className="flex items-center justify-between px-5 py-3 border-b border-gray-100">
                  <span className="text-sm font-semibold text-gray-900">{booked ? "You're booked 🎉" : 'Pick a time'}</span>
                  <button onClick={close} className="text-gray-300 hover:text-gray-500 bg-transparent border-none cursor-pointer text-2xl leading-none" aria-label="Close">×</button>
                </div>
                {booked ? (
                  <div className="p-8 text-center">
                    <div className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4" style={{ background: '#dcfce7' }}><Icon name="check" className="w-7 h-7" style={{ color: '#16a34a' }} /></div>
                    <h3 className="text-gray-900 text-lg font-semibold mb-1">See you soon.</h3>
                    <p className="text-gray-500 text-sm">Check your inbox for the calendar invite, talk then.</p>
                    <button onClick={close} className="mt-5 px-6 py-2.5 rounded-full font-semibold text-sm border-none cursor-pointer" style={{ background: '#0a66c2', color: '#fff' }}>Done</button>
                  </div>
                ) : (
                  <div id="cal-embed" style={{ minWidth: '320px', height: '62vh' }} />
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* Internal admin view (/?roasts=1): the roasts list, read straight from the
       Redis-backed index via /api/roast-view?action=list. No Notion. Standalone so
       it doesn't depend on AdRoastApp state; the endpoint gates to admin emails. */
    function RoastsListView() {
      const [state, setState] = useState({ loading: true, err: '', items: [] });
      useEffect(() => {
        let alive = true;
        fetch('/api/roast-view?action=list&limit=300', { credentials: 'same-origin' })
          .then(async r => ({ ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) }))
          .then(({ ok, status, data }) => {
            if (!alive) return;
            if (ok && Array.isArray(data.items)) setState({ loading: false, err: '', items: data.items });
            else if (status === 401) setState({ loading: false, err: 'admin', items: [] });
            else setState({ loading: false, err: (data && data.error) || 'Could not load roasts', items: [] });
          })
          .catch(() => { if (alive) setState({ loading: false, err: 'Could not load roasts', items: [] }); });
        return () => { alive = false; };
      }, []);

      const fmtDate = (ts) => { if (!ts) return ''; try { return new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
      const scoreColor = (s) => s == null ? '#94a3b8' : s <= 3 ? '#dc2626' : s <= 6 ? '#d97706' : '#0a66c2';
      const Pill = ({ v, label }) => (<span className="inline-flex items-center gap-1 text-xs font-semibold" style={{ color: scoreColor(v) }}>{label} {v == null ? '-' : v}</span>);

      return (
        <div className="min-h-screen" style={{ background: '#f6f8fb' }}>
          <header className="bg-white border-b border-gray-200 sticky top-0 z-10">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <Icon name="flame" className="w-5 h-5" style={{ color: '#0a66c2' }} />
                <span className="font-bold text-gray-900">AdRoast</span>
                <span className="text-gray-300">/</span>
                <span className="text-sm font-semibold text-gray-600">Roasts</span>
              </div>
              <a href="/" className="text-sm font-semibold text-gray-500 hover:text-gray-800 no-underline">← Home</a>
            </div>
          </header>
          <main className="max-w-5xl mx-auto px-4 py-8">
            {state.loading && <div className="text-gray-400 text-sm">Loading roasts…</div>}
            {state.err === 'admin' && (
              <div className="bg-white rounded-xl border border-gray-200 p-8 text-center max-w-md mx-auto">
                <h2 className="text-lg font-semibold text-gray-900 mb-1">Admin only</h2>
                <p className="text-gray-500 text-sm mb-4">Sign in with your AdRoast admin account to see every roast.</p>
                <a href="/api/auth?action=google-start&mode=roast" className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full font-semibold text-sm no-underline" style={{ background: '#0a66c2', color: '#fff' }}>Sign in</a>
              </div>
            )}
            {state.err && state.err !== 'admin' && <div className="text-red-600 text-sm">{state.err}</div>}
            {!state.loading && !state.err && (
              <>
                <h1 className="text-2xl font-light text-gray-900 mb-4">All roasts <span className="text-gray-400 text-lg">({state.items.length})</span></h1>
                {state.items.length === 0
                  ? <div className="text-gray-400 text-sm">No roasts yet.</div>
                  : <div className="space-y-2">
                      {state.items.map((it) => (
                        <a key={it.reportId} href={`/?id=${it.reportId}`} className="block bg-white rounded-xl border border-gray-200 p-4 hover:border-blue-300 transition-colors no-underline">
                          <div className="flex items-center justify-between gap-3 flex-wrap">
                            <div className="min-w-0">
                              <div className="font-semibold text-gray-900 truncate">{it.company || (it.icp ? it.icp.slice(0, 60) : '') || ('Roast ' + (it.reportId || ''))}</div>
                              <div className="text-xs text-gray-400 truncate">{it.icp || (it.source === 'notion' ? 'Earlier roast' : '-')}</div>
                            </div>
                            <div className="flex items-center gap-3 sm:gap-4 flex-shrink-0">
                              <Pill v={it.adScore} label="Ad" />
                              <Pill v={it.lpScore} label="LP" />
                              <Pill v={it.matchScore} label="Match" />
                              <span className="text-xs text-gray-400 capitalize hidden sm:inline">{it.platform || '-'}</span>
                              <span className="text-xs text-gray-400 whitespace-nowrap">{fmtDate(it.ts)}</span>
                              <Icon name="chevronRight" className="w-4 h-4 text-gray-300" />
                            </div>
                          </div>
                        </a>
                      ))}
                    </div>}
              </>
            )}
          </main>
        </div>
      );
    }

    /* Your Live Ads (/?library=1): the upgraded first step. Instead of pasting one ad link,
       the founder enters their website; AdRoast detects their ICP and pulls every live ad
       across LinkedIn, Meta and Google. We surface which ad scores worst (roast it first),
       roast that one free, and gate the rest behind the plan. Every ad is visible with its
       image + main score; only the full roast is paid. Sample data for now, swapped for the
       real /api/adlibrary feed once the platform APIs are connected. */
    const YOUR_ICP = 'AppSec leaders & security engineers at Series B+ SaaS, $20K+/mo ad spend';
    const YOUR_CO = { name: 'Semgrep', domain: 'semgrep.dev', initial: 'S', color: '#12805c' };
    const PLATMETA = {
      LinkedIn: { c: '#0a66c2', g: 'in' },
      Meta: { c: '#0866ff', g: 'f' },
      Google: { c: '#ea4335', g: 'G' }
    };
    /* Sample preview (before a website is entered) - real Semgrep creatives so the board
       never shows a placeholder tile. Only the sources we actually pull (LinkedIn, Google). */
    const YOUR_ADS = [
      { plat: 'Google', head: 'Your SAST tool is lying to you.', dom: 'semgrep.dev', img: 'https://tpc.googlesyndication.com/archive/simgad/7884443371482777976', score: 4, verdict: 'Bold hook, wasted. The landing page opens on a generic product tour and the promise evaporates.', fix: 'Match the landing headline to the ad and put proof in the first scroll. The hook is good, the follow-through is not.' },
      { plat: 'Google', head: 'Semgrep, SAST for AppSec teams.', dom: 'semgrep.dev', img: 'https://tpc.googlesyndication.com/archive/simgad/7128692242221110330', score: 5, verdict: 'Reads like a category label, not a reason to click. No pain, no proof.' },
      { plat: 'LinkedIn', head: 'Ship secure code without slowing devs down.', dom: 'semgrep.dev', score: 5, verdict: 'CTA is fine, but a broad audience and zero proof dilute it.' },
      { plat: 'Google', head: 'Find and fix vulns in your CI.', dom: 'semgrep.dev', img: 'https://tpc.googlesyndication.com/archive/simgad/5979080786588485141', score: 7, verdict: 'Specific pain, clear CTA. Minor landing-page mismatch to tidy.' },
      { plat: 'LinkedIn', head: 'Trusted by 1M+ developers.', dom: 'semgrep.dev', score: 6, verdict: 'Social proof leads, but a buyer is given no clear next step.' },
      { plat: 'LinkedIn', head: 'Find bugs before they ship.', dom: 'semgrep.dev', score: 8, verdict: 'Your best ad. Strong hook and CTA, keep the spend here.' }
    ];
    /* Sources we actually pull live vs. the ones still to come (shown greyed + blurred). */
    const LIVE_SOURCES = ['LinkedIn', 'Google'];
    const SOON_SOURCES = ['Meta'];
    /* Severity label from the roast score, so each ad shows a gravity level (not just a
       number): 1-4 critical mismatch, 5-6 weak, 7-8 solid, 9-10 strong. */
    const SEV = (s) => s <= 4 ? { label: 'Critical', c: '#dc2626', bg: '#fef2f2', bd: '#fecaca' }
      : s <= 6 ? { label: 'Needs work', c: '#b45309', bg: '#fff8ed', bd: '#fde3bd' }
      : s <= 8 ? { label: 'Solid', c: '#0a66c2', bg: '#eef4fb', bd: '#cfe1f5' }
      : { label: 'Strong', c: '#075aad', bg: '#eef4fb', bd: '#cfe1f5' };

    /* Real platform logos (official brand marks), not letter badges. */
    function PlatLogo({ plat, size = 16 }) {
      const s = { width: size, height: size, display: 'block' };
      if (plat === 'LinkedIn') return (<svg viewBox="0 0 24 24" style={s} aria-label="LinkedIn"><rect width="24" height="24" rx="4.2" fill="#0A66C2" /><path fill="#fff" d="M7.12 20.45H3.56V9h3.56v11.45zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67h-3.55V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29z" /></svg>);
      if (plat === 'Meta') return (<svg viewBox="0 0 36 24" style={{ width: size * 1.5, height: size, display: 'block' }} aria-label="Meta"><path fill="#0081FB" d="M6.9 4C3.7 4 1.6 7.5 1.6 12s2 8 5.2 8c2 0 3.4-1.3 5-3.9.9-1.5 1.8-3.2 2.6-4.8.7 1.3 1.5 2.9 2.3 4.3C18.5 18.6 20 20 22 20c3.2 0 4.4-3.5 4.4-8s-1.7-8-4.7-8c-1.9 0-3.4 1.4-4.9 4-.6-1-1.2-2-1.8-2.8C13.6 4.7 12.3 4 10.9 4zm.2 2.6c1 0 1.9.8 2.8 2-.9 1.4-1.8 3-2.6 4.5-1.2 2.2-1.8 2.9-2.6 2.9-1 0-1.7-1.4-1.7-4 0-2.7.9-5.4 4.1-5.4zm14.5 0c1.4 0 2.3 1.8 2.3 5.4 0 2.6-.6 4-1.7 4-.8 0-1.4-.7-2.5-2.7-.6-1.1-1.3-2.5-2-3.9 1-1.7 2-2.8 3.6-2.8z" /></svg>);
      if (plat === 'Google') return (<svg viewBox="0 0 24 24" style={s} aria-label="Google"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>);
      return null;
    }

    /* Real company logo pulled by domain (works for any advertiser live). Clearbit first,
       Google favicon fallback, then the letter initial if both fail. */
    function BrandLogo({ domain, name, initial, color, size = 44, radius = 12 }) {
      const [src, setSrc] = useState('https://logo.clearbit.com/' + domain + '?size=128');
      const [dead, setDead] = useState(false);
      const box = { width: size, height: size, borderRadius: radius };
      if (dead || !domain) return (<div className="flex-none grid place-items-center font-bold text-white" style={{ ...box, background: color || '#334155', fontSize: size * 0.42 }}>{initial || (name || '?').charAt(0)}</div>);
      return (<img src={src} alt={name || domain} onError={() => { if (src.indexOf('clearbit') > -1) setSrc('https://www.google.com/s2/favicons?domain=' + domain + '&sz=128'); else setDead(true); }} className="flex-none object-contain bg-white border border-gray-200" style={{ ...box }} />);
    }

    /* AdRoast brand mark (also used in the main app header) - module-level so the Live Ads
       board header can match the rest of the app. */
    // Real brand mark served from our own origin. (The old inline base64 decoded to a fully
    // transparent PNG -> the logo rendered invisible everywhere; that was the "no logo" bug.)
    const ADROAST_LOGO = "/apple-touch-icon.png";

    /* Path the page was first opened at (captured before any effect rewrites the URL to "/").
       Lets a clean deep link like /work-with-us land directly on that section. */
    const BOOT_PATH = (typeof window !== 'undefined' ? window.location.pathname.replace(/\/+$/, '') : '');

    function AdLibraryView() {
      const [modalHead, setModalHead] = useState(null);
      const [fP, setFP] = useState('all');
      const [siteInput, setSiteInput] = useState('');
      const [real, setReal] = useState(null);      // { co, icp, ads } once real ads load
      const [phase, setPhase] = useState('idle');  // idle | loading | error
      const [statusMsg, setStatusMsg] = useState('');
      const [stage, setStage] = useState('overview'); // overview (platforms) -> grid (one platform's ads)
      const [gridPlat, setGridPlat] = useState('all'); // which platform's ads the grid shows
      const [sel, setSel] = useState(null);            // ad the user picked -> confirm pop-up
      const [landingInput, setLandingInput] = useState(''); // landing page for the picked ad (auto or manual)
      const [acct, setAcct] = useState({ loaded: false, signedIn: false }); // roast credits for the pop-up
      // True during the initial background pull of real ads, so the overview shows a clean loading
      // state instead of the static sample (whose LinkedIn tiles aren't the real creatives yet).
      const [bootLoading, setBootLoading] = useState(true);
      const [soon, setSoon] = useState(null);          // platform whose "coming soon" detail is open
      const [specHi, setSpecHi] = useState(null);      // hovered node in the ad spectrum (index into scored)
      const [icpOverride, setIcpOverride] = useState(null); // user-edited ICP (null = use detected)
      const [icpEditing, setIcpEditing] = useState(false);
      const [icpDraft, setIcpDraft] = useState('');

      /* Per-step browser history: entering a platform's grid pushes ?library=1&p=<plat>, so the
         browser Back button returns to the platform overview (not out to the home page). Driven by
         the URL so Back AND Forward both work; if the library param is gone the browser has already
         navigated to a different document (home), and this no-ops. */
      React.useEffect(() => {
        const onPop = () => {
          // This effect only runs while the board is mounted, so drive the step straight off the
          // URL: ?p=<plat> means a platform grid, no p means the overview. (The app keeps the base
          // board URL at "/", so Back from a grid lands here with no p and returns to overview.)
          const p = new URLSearchParams(window.location.search).get('p');
          if (p && ['LinkedIn', 'Google', 'Meta'].indexOf(p) !== -1) { setFP(p); setStage('grid'); }
          else { setStage('overview'); setFP('all'); }
          window.scrollTo(0, 0);
        };
        window.addEventListener('popstate', onPop);
        return () => window.removeEventListener('popstate', onPop);
      }, []);
      const openGrid = (p) => {
        setFP(p); setStage('grid');
        try { window.history.pushState({ libGrid: p }, '', '?library=1&p=' + encodeURIComponent(p)); } catch (e) {}
        window.scrollTo(0, 0);
      };

      const hostOf = (u) => { try { return new URL(/^https?:\/\//.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      /* Route every creative through our own origin so ad-blockers (which block the raw
         googlesyndication.com / licdn.com hosts by name) can't make them vanish. Only for
         DISPLAY - the roast handoff keeps the raw URL, which the server fetches directly. */
      // Route creative images through our origin so ad-blockers don't nuke them. Base64url the
      // target URL (param p=) so the blocked hostnames never appear literally in the proxy URL -
      // otherwise a substring filter (Brave/uBlock) matches "googlesyndication"/"licdn" in the
      // query and blocks the proxy request too, exactly as it blocks the original hotlink.
      const IMG = (u) => {
        if (!u || !/^https?:\/\//.test(u)) return u;
        try { return '/api/icp?p=' + btoa(u).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
        catch (e) { return '/api/icp?img=' + encodeURIComponent(u); }
      };

      // Enter a website -> detect company + ICP, then pull the company's real live ads
      // (with creative images) from the LinkedIn Ad Library via /api/ads (Apify).
      const loadReal = async (s, opts = {}) => {
        const siteRaw = (s || '').trim();
        if (!siteRaw) return;
        // silent (background demo autoload): don't surface spinners/errors over the sample.
        const silent = !!opts.silent;
        if (!silent) { setPhase('loading'); setReal(null); setBootLoading(false); }
        setStatusMsg('Reading your site and finding your ICP…');
        try {
          const icpRes = await fetch('/api/icp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: siteRaw }) }).then(r => r.json()).catch(() => ({}));
          const coName = icpRes.company || icpRes.brand || hostOf(siteRaw);
          const co = { name: coName, domain: icpRes.domain || hostOf(siteRaw), initial: (coName || '?').charAt(0).toUpperCase(), color: '#334155' };
          const icpText = icpRes.icp_text || '';
          if (!silent) setStatusMsg('Pulling your live ads from LinkedIn and Google…');
          const res = await fetch('/api/icp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'ads-fetch', company: coName, domain: co.domain, icp: icpText, refresh: !!opts.refresh }) }).then(r => r.json()).catch(() => ({}));
          if (!res || !res.ok || !(res.ads && res.ads.length)) {
            // Silent demo: keep showing the static sample; only a real user's fetch surfaces an error.
            if (silent) { setPhase('idle'); setBootLoading(false); return; }
            setPhase('error');
            setStatusMsg('Could not fetch your ads (' + ((res && res.reason) || 'error') + '). Try again.');
            return;
          }
          setReal({ co, icp: icpText, ads: res.ads || [], notes: res.notes || {} });
          setStage('overview'); setGridPlat('all');
          setPhase('idle'); setBootLoading(false);
        } catch (e) { if (silent) { setPhase('idle'); setBootLoading(false); return; } setPhase('error'); setStatusMsg(String(e && e.message || e)); }
      };

      useEffect(() => {
        try {
          const s = new URLSearchParams(window.location.search).get('site');
          if (s) { setSiteInput(s); loadReal(s); return; }
        } catch (e) {}
        /* No website given: show the static sample instantly (creatives visible via the
           proxy), and in the BACKGROUND pull the real Semgrep ads so the preview upgrades
           to actual live creatives + real scores. Falls back to the sample if the pull fails. */
        setSiteInput('semgrep.dev');
        loadReal('semgrep.dev', { silent: true });
      }, []);

      // Load the roast account so the confirm pop-up can show real remaining credits.
      useEffect(() => {
        fetch('/api/auth?action=me', { credentials: 'same-origin' })
          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (d && d.session && d.session.mode === 'roast') setAcct({ loaded: true, signedIn: true, plan: d.plan || 'free', tokens: (typeof d.tokens === 'number' ? d.tokens : 0) });
            else setAcct({ loaded: true, signedIn: false });
          })
          .catch(() => setAcct({ loaded: true, signedIn: false }));
      }, []);

      // Hand a chosen live ad off to the real roast engine. AdLibraryView renders outside
      // AdRoastApp, so we stash the ad + company + ICP and reload into the main app with
      // ?libroast=1; AdRoastApp picks it up, builds the roast payload (creative included as
      // adImageUrl) and runs the actual /api/roast. Server enforces free vs paid tokens.
      const roastThisAd = (a, co, icpText, landingOverride) => {
        const landing = (landingOverride || a.ctaUrl || '').trim();
        try {
          localStorage.setItem('adroast_library_roast', JSON.stringify({
            ad: { plat: a.plat, head: a.head || '', body: a.body || '', img: a.img || null, detailUrl: a.detailUrl || '', ctaUrl: landing, dom: a.dom || '' },
            co: { name: (co && co.name) || '', domain: (co && co.domain) || '' },
            icp: icpText || ''
          }));
        } catch (e) {}
        window.location.href = '/?libroast=1';
      };

      const usingReal = !!real;
      const CO = real ? real.co : YOUR_CO;
      const ICP = real ? real.icp : YOUR_ICP;
      const ICPeff = (icpOverride != null && icpOverride.trim()) ? icpOverride.trim() : ICP; // what the roast grades against
      const ads = real ? real.ads : YOUR_ADS;
      const scored = ads.filter(a => typeof a.score === 'number');
      // Seed the landing field when an ad is picked: auto-fill the ad's resolved landing if we have
      // one, otherwise pre-fill the company homepage so the user can paste the exact landing.
      React.useEffect(() => {
        if (!sel) return;
        const dom = (CO && CO.domain) ? String(CO.domain).replace(/^https?:\/\//, '').replace(/\/.*$/, '') : '';
        setLandingInput(sel.ctaUrl || (dom ? 'https://' + dom : ''));
      }, [sel]);
      // How many ads are off-target for the ICP (score <= 6). This is the headline number a
      // first-timer actually cares about: how many ads are working against them right now.
      const offTarget = scored.filter(a => a.score <= 6).length;
      const worst = scored.length ? scored.reduce((m, a) => a.score < m.score ? a : m, scored[0]) : null;
      const isFree = (a) => !!worst && a === worst; // the worst-scoring ad gets the free roast
      const shown = ads.filter(a => fP === 'all' || a.plat === fP);
      // Worst-scoring ad among what's on screen (the current platform), flagged as the free one.
      const shownScored = shown.filter(a => typeof a.score === 'number');
      const vWorst = shownScored.length ? shownScored.reduce((m, a) => a.score < m.score ? a : m, shownScored[0]) : null;
      const isVFree = (a) => !!vWorst && a === vWorst;
      // Show the recommended (worst / free) creative first, then the rest most-urgent-first. Unscored last.
      const shownOrdered = shown.slice().sort((a, b) => {
        const sa = typeof a.score === 'number' ? a.score : 999;
        const sb = typeof b.score === 'number' ? b.score : 999;
        return sa - sb;
      });
      const avg = scored.length ? (scored.reduce((s, a) => s + a.score, 0) / scored.length).toFixed(1) : null;
      const plats = [...new Set(ads.map(a => a.plat))];
      const scoreCol = (s) => s == null ? '#94a3b8' : s <= 3 ? '#dc2626' : s <= 6 ? '#d97706' : '#0a66c2';

      // The ad spectrum: every scored ad as a node on a red->blue line by buyer fit. Hover (or
      // tap) a node and its REAL creative previews up top, so "start here" and the actual ad read
      // as one thing, not two. The worst is flagged. Gamified with a portfolio fit score /100.
      const renderSpectrum = (items, opts) => {
        const sc = (items || []).filter(a => typeof a.score === 'number');
        if (sc.length < 1) return null;
        // allPlatforms = the overview spectrum spanning every platform at once, so each node
        // carries a small platform mark and the header reads as the whole portfolio.
        const allPlat = !!(opts && opts.allPlatforms);
        const platSet = allPlat ? Array.from(new Set(sc.map(a => a.plat).filter(Boolean))) : [];
        let worstIdx = 0;
        sc.forEach((a, i) => { if (a.score < sc[worstIdx].score) worstIdx = i; });
        const fit = Math.round(sc.reduce((s, a) => s + a.score, 0) / sc.length * 10);
        const onT = sc.filter(a => a.score > 6).length;
        const active = (specHi != null && sc[specHi]) ? sc[specHi] : sc[worstIdx];
        const aFree = isVFree(active);
        // Spread nodes that share a rounded score so they don't stack on one point.
        const groupCount = {};
        sc.forEach(a => { const k = Math.round(a.score); groupCount[k] = (groupCount[k] || 0) + 1; });
        const seen = {};
        const nodeX = sc.map(a => {
          const k = Math.round(a.score); const total = groupCount[k]; const idx = (seen[k] = (seen[k] || 0)); seen[k] = idx + 1;
          const base = Math.max(6, Math.min(94, a.score * 10));
          return Math.max(5, Math.min(95, base + (idx - (total - 1) / 2) * 5));
        });
        return (
          <div className="rounded-2xl border bg-white mb-6" style={{ borderColor: '#e8ecf1', padding: '18px 20px' }}>
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <span className="inline-flex items-center gap-1.5 rounded-full" style={{ padding: '3px 10px', background: '#0a66c214', color: '#0a66c2', fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.05em' }}><Icon name="target" className="w-3 h-3" />{allPlat ? 'Every ad, ranked' : 'Your ad spectrum'}</span>
              <div className="flex items-center gap-2.5" style={{ fontSize: 13 }}>
                {allPlat && platSet.length > 0 && <span className="flex items-center gap-1 mr-0.5">{platSet.map(pl => <PlatLogo key={pl} plat={pl} size={14} />)}</span>}
                <span className="font-extrabold" style={{ color: scoreCol(fit / 10) }}>{fit}<span className="text-gray-400 font-semibold" style={{ fontSize: 11 }}>/100 fit</span></span>
                <span className="text-gray-300">·</span>
                <span className="text-gray-500">{onT}/{sc.length} on target</span>
              </div>
            </div>
            <p className="text-gray-500" style={{ fontSize: 12.5, marginTop: 6 }}>{allPlat ? 'Every live ad across your platforms, ranked by buyer fit. Hover one to preview it, start with the leftmost.' : 'Hover an ad to preview it. Left is reaching the wrong buyer, right is on target.'}</p>
            {/* Live preview of the active (hovered, else worst) ad: the real creative, up close. */}
            <div className="flex items-center gap-3.5 rounded-xl border mt-4" style={{ borderColor: '#eef1f6', background: '#fafbfc', padding: 12 }}>
              <div className="flex-none grid place-items-center rounded-lg overflow-hidden" style={{ width: 74, height: 74, background: '#f1f5f9', border: '2px solid ' + scoreCol(active.score) }}>
                <img src={IMG(active.img)} alt={active.head || 'creative'} style={{ maxWidth: '100%', maxHeight: '100%', width: 'auto', height: 'auto' }} />
              </div>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div className="flex items-center gap-2 flex-wrap">
                  {aFree && <span className="inline-flex items-center gap-1 font-bold uppercase" style={{ fontSize: 9, letterSpacing: '0.06em', color: '#fff', background: '#dc2626', padding: '2px 7px', borderRadius: 5 }}><Icon name="flame" className="w-2.5 h-2.5" />Start here</span>}
                  {allPlat && active.plat && <span className="inline-flex items-center gap-1 font-semibold text-gray-600" style={{ fontSize: 11 }}><PlatLogo plat={active.plat} size={13} />{active.plat}</span>}
                  <span className="font-bold" style={{ color: scoreCol(active.score), fontSize: 13 }}>{active.score}/10 buyer fit</span>
                  <span style={{ fontSize: 11.5, fontWeight: 700, color: SEV(active.score).c }}>{SEV(active.score).label}</span>
                </div>
                <div className="text-gray-800 truncate" style={{ fontSize: 13.5, fontWeight: 600, marginTop: 3 }}>{active.head || active.body || 'Live creative'}</div>
                <div className="text-gray-500 truncate" style={{ fontSize: 12.5, marginTop: 1 }}>{active.fix || active.verdict || active.body || ''}</div>
              </div>
              <button onClick={() => setSel(active)} className="flex-none font-bold text-white rounded-lg hover:opacity-90 transition-opacity" style={{ fontSize: 12.5, padding: '9px 13px', background: '#0a66c2', whiteSpace: 'nowrap' }}>{aFree ? 'Roast free →' : 'Roast this →'}</button>
            </div>
            {/* The track: nodes are the real creatives, positioned by buyer fit. */}
            <div className="relative" style={{ height: 86, marginTop: 22 }}>
              <div className="absolute" style={{ left: 0, right: 0, top: 40, height: 6, borderRadius: 99, background: 'linear-gradient(90deg,#dc2626,#d97706 48%,#0a66c2)', opacity: 0.9 }} />
              {sc.map((a, i) => {
                const on = specHi === i;
                const isWorst = i === worstIdx;
                const col = scoreCol(a.score);
                return (
                  <button key={i} onMouseEnter={() => setSpecHi(i)} onMouseLeave={() => setSpecHi(null)} onFocus={() => setSpecHi(i)} onClick={() => setSel(a)}
                    className="absolute bg-transparent border-none p-0 cursor-pointer" title={a.head || 'ad'}
                    style={{ left: nodeX[i] + '%', top: 16, transform: 'translateX(-50%) scale(' + (on ? 1.16 : 1) + ')', transition: 'transform .18s ease', zIndex: on ? 6 : (isWorst ? 4 : 2) }}>
                    {isWorst && <span className="absolute left-1/2 whitespace-nowrap" style={{ transform: 'translateX(-50%)', top: -14, fontSize: 8.5, fontWeight: 800, color: '#dc2626', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Start here</span>}
                    <span className="block rounded-full overflow-hidden" style={{ width: 46, height: 46, border: '2.5px solid ' + col, background: '#f1f5f9', boxShadow: on ? '0 8px 20px rgba(11,15,26,.20)' : '0 2px 6px rgba(11,15,26,.12)' }}>
                      <img src={IMG(a.img)} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                    </span>
                    {allPlat && a.plat && <span className="absolute grid place-items-center rounded-full bg-white" style={{ left: -5, top: -5, width: 18, height: 18, border: '1.5px solid #e5e7eb', boxShadow: '0 1px 3px rgba(11,15,26,.14)' }} title={a.plat}><PlatLogo plat={a.plat} size={11} /></span>}
                    <span className="absolute grid place-items-center rounded-full text-white" style={{ right: -5, bottom: -5, width: 19, height: 19, background: col, fontSize: 10, fontWeight: 800, border: '2px solid #fff' }}>{a.score}</span>
                  </button>
                );
              })}
              <span className="absolute" style={{ left: 0, top: 58, fontSize: 9.5, color: '#dc2626', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Critical</span>
              <span className="absolute" style={{ right: 0, top: 58, fontSize: 9.5, color: '#0a66c2', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.05em' }}>On target</span>
            </div>
          </div>
        );
      };

      const chip = (active, onClick, children, plat) => (
        <button onClick={onClick} className="inline-flex items-center gap-1.5 rounded-full font-medium transition-colors" style={{ fontSize: '13px', padding: '7px 13px', border: '1px solid ' + (active ? '#111827' : '#d1d5db'), background: active ? '#111827' : '#fff', color: active ? '#fff' : '#4b5563' }}>
          {plat && <PlatLogo plat={plat} size={15} />}{children}
        </button>
      );

      return (
        <div className="min-h-screen" style={{ background: '#f6f8fb' }}>
          <header className="bg-white border-b border-gray-200 sticky top-0 z-10" style={{ backdropFilter: 'blur(12px)', background: 'rgba(255,255,255,0.95)' }}>
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
              <a href="/" className="flex items-center gap-2.5 no-underline">
                <img src={ADROAST_LOGO} alt="AdRoast" className="w-8 h-8 rounded" />
                <span className="text-lg text-gray-800 font-semibold">AdRoast</span>
                <span className="text-gray-300">/</span>
                <span className="text-sm font-semibold text-gray-500">Your Live Ads</span>
              </a>
              <div className="flex items-center gap-3">
                {acct.signedIn && (acct.plan === 'unlimited' || typeof acct.tokens === 'number') && (
                  <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ background: (acct.plan === 'unlimited' || acct.tokens > 0) ? '#dcfce7' : '#fef2f2', color: (acct.plan === 'unlimited' || acct.tokens > 0) ? '#15803d' : '#b91c1c' }}>{acct.plan === 'unlimited' ? 'Unlimited' : `${acct.tokens} roast${acct.tokens === 1 ? '' : 's'} left`}</span>
                )}
                <a href="/" className="text-sm font-semibold text-gray-500 hover:text-gray-800 no-underline">Home</a>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8">
            {/* Intermediate step: this sits between the landing form (enter website) and
                the roast. The stepper makes that placement obvious. */}
            <div className="flex items-center gap-2 mb-6" style={{ maxWidth: 560 }}>
              {[
                { n: '✓', label: 'Your website', done: true },
                { n: '2', label: 'Your live ads', active: true },
                { n: '3', label: 'Roast' },
              ].map((s, i, arr) => (
                <React.Fragment key={i}>
                  <div className="flex items-center gap-2">
                    <div className="grid place-items-center rounded-full font-bold flex-none" style={{ width: 24, height: 24, fontSize: 12, background: s.done || s.active ? '#0a66c2' : '#e5e7eb', color: s.done || s.active ? '#fff' : '#9ca3af', opacity: s.done ? 0.55 : 1 }}>{s.n}</div>
                    <span className="font-semibold" style={{ fontSize: 12.5, color: s.done ? '#0a66c2' : s.active ? '#0a66c2' : '#9ca3af', opacity: s.done ? 0.7 : 1 }}>{s.label}</span>
                  </div>
                  {i < arr.length - 1 && <div className="flex-1 rounded-full" style={{ height: 2, background: s.done ? '#0a66c2' : '#e5e7eb' }} />}
                </React.Fragment>
              ))}
            </div>

            {/* Website entry lives in STEP 1. Once we have results (step 2), the website is fixed -
                to change it you go back (the "change" control resets to the entry state). */}
            {ads.length === 0 ? (
              <div className="mb-6">
                <label className="block font-semibold text-gray-700 mb-1.5" style={{ fontSize: 13 }}>Your website</label>
                <div className="flex gap-2" style={{ maxWidth: 480 }}>
                  <input value={siteInput} onChange={(e) => setSiteInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); loadReal(siteInput); } }}
                    placeholder="e.g. semgrep.dev" disabled={phase === 'loading'}
                    className="flex-1 px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-900" />
                  <button onClick={() => loadReal(siteInput)} disabled={phase === 'loading' || !siteInput.trim()}
                    style={{ backgroundColor: '#0a66c2' }} className="px-4 py-2.5 rounded-lg font-semibold text-sm text-white hover:opacity-90 transition-opacity disabled:opacity-50 flex-none">
                    {phase === 'loading' ? 'Finding…' : 'Find my ads'}
                  </button>
                </div>
                {phase === 'loading' && <div className="flex items-center gap-2.5 text-sm text-gray-600 mt-3"><span className="inline-block w-4 h-4 rounded-full border-2 border-blue-200 animate-spin" style={{ borderTopColor: '#0a66c2' }}></span>{statusMsg}</div>}
                {phase === 'error' && <div className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2.5 mt-3" style={{ maxWidth: 480 }}>{statusMsg}</div>}
                {usingReal && real.ads.length === 0 && phase !== 'loading' && <div className="text-sm text-gray-500 mt-3">No live ads found for <b>{CO.name}</b> on LinkedIn or Google. Try the exact company name, or a site that runs ads on those platforms.</div>}
              </div>
            ) : (
              <div className="mb-6 inline-flex items-center gap-2 rounded-lg" style={{ fontSize: 13, background: '#f8fafc', border: '1px solid #e5e7eb', color: '#374151', padding: '7px 12px' }}>
                <Icon name="check" className="w-4 h-4" style={{ color: '#0a66c2' }} />
                <span className="font-semibold">Your website:</span>
                <span style={{ fontFamily: 'monospace' }}>{CO.domain}</span>
                <button onClick={() => { setReal(null); setPhase('idle'); setStage('overview'); setFP('all'); }} className="ml-1 no-underline bg-transparent border-none cursor-pointer p-0 font-semibold" style={{ color: '#0a66c2' }}>change</button>
              </div>
            )}

            {ads.length > 0 && (<>
            {/* Company + detected ICP */}
            <div className="flex items-center gap-3 flex-wrap mb-4">
              <BrandLogo domain={CO.domain} name={CO.name} initial={CO.initial} color={CO.color} size={44} radius={12} />
              <div>
                <h1 className="font-bold text-gray-900" style={{ fontSize: 22, letterSpacing: '-0.01em' }}>{CO.name}</h1>
                <div className="text-gray-400 flex items-center gap-2" style={{ fontSize: 12.5, fontFamily: 'monospace' }}>{CO.domain}</div>
              </div>
              <div className="ml-auto text-right">
                <div className="font-bold text-gray-900" style={{ fontSize: 17, lineHeight: 1 }}>{ads.length}</div>
                <div className="text-gray-400" style={{ fontSize: 12, marginTop: 3 }}>live ad{ads.length === 1 ? '' : 's'}{usingReal ? (plats.length ? ' on ' + plats.join(' & ') : '') : ' on LinkedIn & Google'}</div>
              </div>
            </div>
            {(ICPeff || icpEditing) && <div className="mb-6 rounded-xl border" style={{ background: '#f8fafc', borderColor: '#e5e7eb', padding: '10px 12px' }}>
              {icpEditing ? (
                <div>
                  <div className="font-semibold text-gray-500 uppercase tracking-wider mb-1.5" style={{ fontSize: 10, letterSpacing: '0.1em' }}>Who we grade every ad against</div>
                  <textarea value={icpDraft} onChange={(e) => setIcpDraft(e.target.value)} rows={2} placeholder="e.g. Heads of security at Series B+ SaaS spending $20K+/mo on ads" className="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 text-gray-900" style={{ resize: 'vertical' }} />
                  <div className="flex items-center gap-2 mt-2">
                    <button onClick={() => { setIcpOverride(icpDraft); setIcpEditing(false); }} className="font-semibold text-white rounded-lg" style={{ fontSize: 12.5, padding: '6px 14px', background: '#0a66c2' }}>Save</button>
                    <button onClick={() => setIcpEditing(false)} className="font-semibold text-gray-500 bg-transparent border-none cursor-pointer" style={{ fontSize: 12.5 }}>Cancel</button>
                    <span className="text-gray-400" style={{ fontSize: 11.5 }}>Every roast will be graded against this buyer.</span>
                  </div>
                </div>
              ) : (
                <div className="flex items-center gap-2.5 flex-wrap">
                  <Icon name="target" className="w-4 h-4 flex-none" style={{ color: '#0a66c2' }} />
                  <span className="font-semibold text-gray-700" style={{ fontSize: 12.5 }}>Grading against:</span>
                  <span className="text-gray-600 flex-1 min-w-0" style={{ fontSize: 12.5, lineHeight: 1.45 }}>{ICPeff}</span>
                  <button onClick={() => { setIcpDraft(ICPeff || ''); setIcpEditing(true); }} className="font-semibold rounded-full bg-white cursor-pointer hover:bg-blue-50 transition-colors flex-none" style={{ fontSize: 11.5, padding: '4px 12px', border: '1px solid #cfe1f5', color: '#0a66c2' }}>Edit buyer</button>
                </div>
              )}
            </div>}

            {scored.length > 0 && !bootLoading && (() => {
              const offPct = Math.round(offTarget / scored.length * 100);
              const crit = scored.filter(a => a.score <= 4).length;
              const sev = (offPct >= 30 || crit >= 2) ? { t: 'Budget at risk', c: '#dc2626' }
                : (offPct >= 10 || crit >= 1) ? { t: 'Leaking budget', c: '#b45309' }
                : offPct > 0 ? { t: 'Minor leaks', c: '#b45309' }
                : { t: 'On track', c: '#0a66c2' };
              const head = offTarget > 0
                ? `${offTarget} of your ${scored.length} live ads are reaching the wrong buyer`
                : `All ${scored.length} of your live ads match the buyer you want`;
              const sub = offTarget > 0
                ? `That's ad spend going to people who won't buy${crit ? `, and ${crit} ${crit === 1 ? 'ad is' : 'ads are'} badly off` : ''}. Fix the weakest first, it's free.`
                : 'Nice, your spend is reaching the right people. Keep watching as you add creatives.';
              return <div className="mb-6"><UrgencyMeter label={sev.t} color={sev.c} offOverride={offPct} bigStat={offPct} bigUnit="%" bigCaption="ads off-target" headline={head} subline={sub} /></div>;
            })()}

            {stage === 'overview' ? (
              /* STEP 1 - Overview: one card per platform we actually pull, each showing a real
                 sample creative in full. Click a platform to see the status of every ad on it.
                 Sources we don't have yet (Meta) show greyed + blurred as "coming soon". */
              <>
                {/* Portfolio spectrum FIRST: every scored ad across all platforms on one line,
                    so the single most urgent ad to roast is obvious before the per-platform grid. */}
                {renderSpectrum(ads, { allPlatforms: true })}
                <div className="flex items-baseline gap-2.5 mb-3 flex-wrap">
                  <div className="font-semibold text-gray-500 uppercase tracking-wider" style={{ fontSize: 10.5, letterSpacing: '0.1em' }}>Where you're running ads</div>
                  <span className="text-gray-400" style={{ fontSize: 11.5 }}>We score every ad on how well it fits your ideal customer. Red = fix it first.</span>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: 16 }}>
                  {LIVE_SOURCES.concat(ads.some(a => a.plat === 'Meta') ? ['Meta'] : []).map(p => {
                    /* Initial background pull: show a clean loading card per platform instead of the
                       static sample, so a real creative never lands in the wrong platform's slot. */
                    if (bootLoading && !real) return (
                      <div key={p} className="rounded-2xl border overflow-hidden flex flex-col" style={{ borderColor: '#e5e7eb', background: '#fff' }}>
                        <div className="flex items-center gap-2 px-4 py-3 border-b border-gray-100">
                          <PlatLogo plat={p} size={18} />
                          <span className="font-bold text-gray-900" style={{ fontSize: 15 }}>{p}</span>
                          <span className="ml-auto inline-flex items-center gap-1.5 text-gray-400" style={{ fontSize: 11 }}><span className="inline-block w-3 h-3 rounded-full border-2 border-gray-200 animate-spin" style={{ borderTopColor: '#0a66c2' }} />Loading</span>
                        </div>
                        <div className="grid place-items-center px-4" style={{ height: 250, background: '#fafbfc' }}>
                          <div className="text-center">
                            <span className="inline-block w-6 h-6 rounded-full border-2 border-gray-200 animate-spin" style={{ borderTopColor: '#0a66c2', marginBottom: 10 }} />
                            <div className="text-gray-500 font-semibold" style={{ fontSize: 12.5 }}>Pulling your live {p} ads…</div>
                            <div className="text-gray-400" style={{ fontSize: 11.5, marginTop: 2 }}>Reading real creatives and scoring them</div>
                          </div>
                        </div>
                        <div className="px-4 py-3"><span className="inline-block rounded" style={{ width: '55%', height: 10, background: '#eef1f5' }} /></div>
                      </div>
                    );
                    const list = ads.filter(a => a.plat === p);
                    const sc = list.filter(a => typeof a.score === 'number');
                    const rep = sc.length ? sc.reduce((m, a) => a.score < m.score ? a : m, sc[0]) : list[0];
                    const pAvg = sc.length ? (sc.reduce((s, a) => s + a.score, 0) / sc.length).toFixed(1) : null;
                    const repSev = rep && typeof rep.score === 'number' ? SEV(rep.score) : null;
                    const platOff = sc.filter(a => a.score <= 6).length; // ads reaching the wrong buyer
                    const platCrit = sc.filter(a => a.score <= 4).length; // badly off
                    const platC = platCrit >= 1 ? '#dc2626' : platOff > 0 ? '#b45309' : '#0a66c2';
                    // Count-based verdict so it can't contradict itself and ranks urgency by how many are off.
                    const pv = !sc.length ? null
                      : platOff === 0 ? { t: 'All reaching the right buyer', c: '#0a66c2' }
                      : { t: platOff + ' of ' + sc.length + ' reaching the wrong buyer', c: platC };
                    // Why is this platform empty? 'ok' = has ads, 'no_ads' = genuinely none running,
                    // anything else = the fetch failed (e.g. LinkedIn Jina rate-limit) and we should
                    // offer a retry instead of falsely claiming they run nothing there.
                    const note = usingReal && real.notes ? (real.notes[p.toLowerCase()] || 'no_ads') : 'ok';
                    const fetchFailed = list.length === 0 && note !== 'ok' && note !== 'no_ads';

                    /* State D - the fetch failed (not "no ads"). Semgrep DOES run LinkedIn ads, but
                       Jina rate-limited us this run. Say so honestly and let them retry. */
                    if (fetchFailed) return (
                      <div key={p} className="rounded-2xl border overflow-hidden flex flex-col" style={{ borderColor: '#e5e7eb', background: '#fff' }}>
                        <div className="flex items-center gap-2 px-4 py-3 border-b border-gray-100">
                          <PlatLogo plat={p} size={18} />
                          <span className="font-bold text-gray-900" style={{ fontSize: 15 }}>{p}</span>
                          <span className="ml-auto uppercase tracking-wider font-semibold" style={{ fontSize: 9, letterSpacing: '0.06em', color: '#64748b', background: '#f1f5f9', padding: '3px 8px', borderRadius: 6 }}>Retry needed</span>
                        </div>
                        <div className="grid place-items-center px-4" style={{ height: 250, background: '#fafbfc' }}>
                          <div className="text-center" style={{ maxWidth: 250 }}>
                            <Icon name="rotateCcw" className="w-6 h-6 mx-auto mb-2" style={{ color: '#94a3b8' }} />
                            <div className="text-gray-700 font-semibold" style={{ fontSize: 12.5 }}>We couldn't reach {p} just now</div>
                            <div className="text-gray-400" style={{ fontSize: 11.5, marginTop: 3, lineHeight: 1.45 }}>A temporary fetch limit on our side, not your account. Give it a moment and retry.</div>
                          </div>
                        </div>
                        <div className="px-4 py-3">
                          <button onClick={() => loadReal(siteInput || (CO && CO.domain) || '', { refresh: true })} disabled={phase === 'loading'} className="w-full font-bold rounded-lg transition-colors hover:bg-blue-50" style={{ fontSize: 13, padding: '9px', border: '1.5px solid #0a66c2', color: '#0a66c2', background: '#fff' }}>{phase === 'loading' ? 'Retrying…' : 'Retry ' + p + ' →'}</button>
                        </div>
                      </div>
                    );

                    /* State B - supported platform, genuinely running NO ads. Distinct from Meta's
                       "coming soon" (we support it, they just aren't live) and from State D (failed). */
                    if (list.length === 0) return (
                      <div key={p} className="rounded-2xl border overflow-hidden flex flex-col select-none" style={{ borderColor: '#e5e7eb', background: '#fff' }}>
                        <div className="flex items-center gap-2 px-4 py-3 border-b border-gray-100">
                          <span style={{ opacity: 0.55 }}><PlatLogo plat={p} size={18} /></span>
                          <span className="font-bold text-gray-500" style={{ fontSize: 15 }}>{p}</span>
                          <span className="ml-auto uppercase tracking-wider font-semibold" style={{ fontSize: 9, letterSpacing: '0.06em', color: '#64748b', background: '#f1f5f9', padding: '3px 8px', borderRadius: 6 }}>No live ads</span>
                        </div>
                        <div className="grid place-items-center px-4" style={{ height: 250, background: '#fafbfc' }}>
                          <div className="text-center">
                            <Icon name="target" className="w-6 h-6 mx-auto mb-2" style={{ color: '#cbd5e1' }} />
                            <div className="text-gray-500 font-semibold" style={{ fontSize: 12.5 }}>Nothing running on {p}</div>
                          </div>
                        </div>
                        <div className="px-4 py-3"><span className="text-gray-400" style={{ fontSize: 12 }}>{CO.name} isn't advertising on {p} right now.</span></div>
                      </div>
                    );

                    /* State A - running: real creative framed with margin + colour-coded average. */
                    return (
                      <button key={p} onClick={() => openGrid(p)} className="group bg-white rounded-2xl border overflow-hidden flex flex-col text-left cursor-pointer p-0 transition-all duration-200 hover:-translate-y-1 hover:shadow-xl" style={{ borderColor: platOff > 0 ? platC + '55' : '#e5e7eb', boxShadow: '0 1px 2px rgba(11,15,26,.04), 0 8px 24px rgba(11,15,26,.05)' }}>
                        <div className="flex items-center gap-2 px-4 py-3 border-b border-gray-100">
                          <PlatLogo plat={p} size={18} />
                          <span className="font-bold text-gray-900" style={{ fontSize: 15 }}>{p}</span>
                          <span className="text-gray-400 font-semibold" style={{ fontSize: 12 }}>{list.length} live</span>
                          {p === 'Meta' && <span className="inline-flex items-center font-semibold uppercase tracking-wider" style={{ fontSize: 8.5, letterSpacing: '0.05em', color: '#475569', background: '#f1f5f9', border: '1px solid #e2e8f0', padding: '2px 6px', borderRadius: 5 }} title="Meta only exposes EU/UK-delivered ads via its official Ad Library API">EU/UK</span>}
                          {sc.length > 0 && <span className="ml-auto inline-flex items-center gap-1.5 font-bold rounded-full" style={{ fontSize: 11, padding: '3px 10px', color: platC, background: platC + '18', border: '1px solid ' + platC + '44' }}><span style={{ width: 6, height: 6, borderRadius: 99, background: platC }} />{platOff > 0 ? platOff + ' to fix' : 'On target'}</span>}
                        </div>
                        <div className="flex items-center justify-center" style={{ background: '#f8fafc', height: 250, padding: 14, borderBottom: '1px solid #eef1f5', overflow: 'hidden' }}>
                          {rep && rep.img
                            ? <img src={IMG(rep.img)} alt={p + ' ad'} style={{ maxWidth: '100%', maxHeight: 222, width: 'auto', height: 'auto', objectFit: 'contain', display: 'block', borderRadius: 8, boxShadow: '0 1px 4px rgba(11,15,26,.12)' }} />
                            : <span style={{ opacity: 0.4 }}><PlatLogo plat={p} size={40} /></span>}
                        </div>
                        <div className="px-4 py-3 flex items-center justify-between gap-2">
                          {pv
                            ? <span className="font-bold" style={{ fontSize: 13, color: pv.c }}>{pv.t}</span>
                            : <span className="text-gray-400" style={{ fontSize: 12 }}>Live creative</span>}
                          <span className="font-bold flex-none inline-flex items-center gap-1 transition-transform group-hover:translate-x-0.5" style={{ fontSize: 13, color: '#0a66c2' }}>See all {list.length} <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                        </div>
                      </button>
                    );
                  })}
                  {/* State C - Meta: not a "you have none" state, a "we can't pull these yet" state.
                      Clearly framed as a platform WE are adding, so it never reads as the advertiser
                      lacking Meta ads. We can't fetch Meta creatives (bot-walled), so no image. */}
                  {SOON_SOURCES.filter(p => !ads.some(a => a.plat === p)).map(p => (
                    <button key={p} onClick={() => setSoon(p)} title={'See what is coming for ' + p} className="group rounded-2xl border overflow-hidden flex flex-col text-left cursor-pointer p-0 transition-all duration-200 hover:-translate-y-1 hover:shadow-lg" style={{ borderColor: '#dbe4ef', borderStyle: 'dashed', background: '#fafbfc' }}>
                      <div className="flex items-center gap-2 px-4 py-3 border-b border-gray-100">
                        <span style={{ opacity: 0.7 }}><PlatLogo plat={p} size={18} /></span>
                        <span className="font-bold text-gray-500" style={{ fontSize: 15 }}>{p}</span>
                        <span className="ml-auto inline-flex items-center gap-1 uppercase tracking-wider font-semibold" style={{ fontSize: 9, letterSpacing: '0.06em', color: '#0a66c2', background: '#eef2ff', border: '1px solid #dbe4fb', padding: '3px 8px', borderRadius: 6 }}><Icon name="sparkles" className="w-3 h-3" />Coming soon</span>
                      </div>
                      <div className="grid place-items-center" style={{ height: 250, background: 'repeating-linear-gradient(45deg,#f6f8fb,#f6f8fb 10px,#eef1f6 10px,#eef1f6 20px)' }}>
                        <span style={{ opacity: 0.45 }}><PlatLogo plat={p} size={40} /></span>
                      </div>
                      <div className="px-4 py-3 flex items-center justify-between gap-2">
                        <span className="text-gray-400" style={{ fontSize: 12 }}>We're adding {p} ads next.</span>
                        <span className="font-bold flex-none inline-flex items-center gap-1 transition-transform group-hover:translate-x-0.5" style={{ fontSize: 12.5, color: '#0a66c2' }}>What's coming <Icon name="arrowRight" className="w-3.5 h-3.5" /></span>
                      </div>
                    </button>
                  ))}
                </div>
              </>
            ) : (<>
            {/* STEP 2 - status of every ad on the chosen platform, colour-coded by gravity. */}
            <div className="flex items-center gap-3 mb-5 flex-wrap">
              <button onClick={() => { if (window.history.state && window.history.state.libGrid) { window.history.back(); } else { setStage('overview'); setFP('all'); try { window.history.replaceState({}, '', '?library=1'); } catch (e) {} window.scrollTo(0, 0); } }} className="inline-flex items-center gap-1.5 font-semibold rounded-full bg-white cursor-pointer hover:bg-gray-50 transition-colors" style={{ fontSize: 13, padding: '7px 13px', border: '1px solid #d1d5db', color: '#4b5563' }}>&larr; All platforms</button>
              <span className="inline-flex items-center gap-2 font-bold text-gray-900" style={{ fontSize: 16 }}><PlatLogo plat={fP} size={18} />{fP} ads</span>
            </div>

            {/* Interactive spectrum: the recommendation and the real creatives, unified. */}
            {renderSpectrum(shown)}

            {/* Grid: every ad visible, full creative + gravity, pick one to roast */}

          window.removeEventListener('touchstart', stop);

        };

      /* Downscale an uploaded creative to <=1024px (long edge) and re-encode as JPEG
         before base64-ing it into the roast payload (optimization #3). Phone
         screenshots are often 3-6MB / millions of pixels; the model doesn't need
         that resolution to read ad copy, and the smaller image is far fewer input
         tokens (and a faster upload). Falls back to the original file on any error,
         and keeps images already under the cap unchanged. Resolves { base64, dataUrl, type }. */
      /* Token optimization: downscale ad creatives aggressively before upload. Image
         input tokens scale with resolution, and 800px on the long edge at JPEG 0.72 keeps
         the rendered ad copy readable while cutting image tokens well below the old
         1024px/0.85 setting. Pasting the copy as text stays the cheapest path of all. */
      const downscaleImage = (file, maxEdge = 800, quality = 0.72) => new Promise((resolve) => {
        const done = (base64, dataUrl, type) => resolve({ base64, dataUrl, type });
        const keepOriginal = () => {
          const r = new FileReader();
          r.onload = () => done(String(r.result).split(',')[1], String(r.result), file.type);
          r.onerror = () => done(null, null, file.type);
          r.readAsDataURL(file);
        };
        try {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            try {
              const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
              if (scale >= 1) { URL.revokeObjectURL(url); return keepOriginal(); }
              const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              URL.revokeObjectURL(url);
              done(dataUrl.split(',')[1], dataUrl, 'image/jpeg');
            } catch (e) { URL.revokeObjectURL(url); keepOriginal(); }
          };
          img.onerror = () => { URL.revokeObjectURL(url); keepOriginal(); };
          img.src = url;
        } catch (e) { keepOriginal(); }
      });

      const generateAdvanced = async () => {

      /* Admin-only helpers to mutate the variants array. */
      const updateVariant = (i, patch) => setAdVariants(prev => prev.map((v, idx) => idx === i ? { ...v, ...patch } : v));
      const updateHeadline = (vi, hi, value) => setAdVariants(prev => prev.map((v, idx) => {
