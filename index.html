    /* ─── STAGED PROCESSING (replaces the plain spinner) ─── */
    const ProcessingView = () => {
      const steps = [
        { icon: 'fileText', label: 'Reading your ad copy & hook' },
        { icon: 'users',    label: 'Scoring against your ICP' },
        { icon: 'linkBreak',label: 'Checking ad ↔ landing page match' },
        { icon: 'zap',      label: 'Writing your fix kit & experiments' },
      ];
      const [active, setActive] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setActive(a => (a < steps.length - 1 ? a + 1 : a)), 3200);
        return () => clearInterval(t);
      }, []);
      const pct = Math.min(94, ((active + 1) / steps.length) * 100 - 6);
      return (
        <div className="min-h-screen bg-gray-100 flex items-center justify-center p-6">

                </div>
                <span className="text-gray-300 text-2xl font-light">|</span>
                <span className="text-2xl font-bold text-gray-900">AdRoast</span>
              </div>

              </div>
              <div className="space-y-1">
                {steps.map((s, i) => {
                  const done = i < active, current = i === active;
                  return (
                    <div key={i} className={`flex items-center gap-3 py-2.5 px-2 rounded-lg transition-colors ${current ? 'bg-blue-50' : ''}`}>
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${done ? 'bg-green-100' : current ? '' : 'bg-gray-100'}`} style={current ? { backgroundColor: '#e8f3ff' } : {}}>
                        {done
                          ? <Icon name="check" className="w-4 h-4" style={{ color: '#16a34a' }} />
                          : current
                            ? <div className="relative w-4 h-4"><div className="absolute inset-0 rounded-full border-2 border-gray-200" /><div style={{ borderColor: '#0a66c2', borderTopColor: 'transparent' }} className="absolute inset-0 rounded-full border-2 animate-spin" /></div>
                            : <Icon name={s.icon} className="w-4 h-4" style={{ color: '#9ca3af' }} />}
                      </div>
                      <span className={`text-sm ${current ? 'font-semibold text-gray-900' : 'text-gray-400'}`}>{s.label}</span>
                      {done && <span className="ml-auto text-xs font-medium" style={{ color: '#16a34a' }}>Done</span>}

    const scoreColor = s => s <= 3 ? 'text-red-600 bg-red-50 border-red-200' : s <= 6 ? 'text-amber-600 bg-amber-50 border-amber-200' : 'text-green-600 bg-green-50 border-green-200';
    const RoastPreview = () => {

    };

    const CountUp = ({ to, suffix = '', prefix = '', dur = 1300 }) => {
      const ref = React.useRef(null);
      const [n, setN] = useState(0);
      useEffect(() => {
        const el = ref.current; if (!el) return; let done = false;
        const ob = new IntersectionObserver(([e]) => {
          if (e.isIntersecting && !done) { done = true;
            const t0 = performance.now();
            const tick = (t) => { const p = Math.min(1, (t - t0) / dur); setN(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(tick); };
            requestAnimationFrame(tick); ob.disconnect();
          }
        }, { threshold: 0.5 });
        ob.observe(el); return () => ob.disconnect();
      }, []);
      return <span ref={ref}>{prefix}{n}{suffix}</span>;
    };

    /* ── Results-page visual primitives (used by the roast report) ─────────── */
    const hexForScore = (s) => (typeof s !== 'number' || s <= 0) ? '#cbd5e1' : s <= 3 ? '#dc2626' : s <= 6 ? '#f59e0b' : '#16a34a';

    /* Urgency meter: a single line that animates to how off-target the score is, coloured by
       gravity, with a bold label + a plain-language consequence so the reader feels the stakes.
       Shared by the roast report and the Live Ads board. `sub` can be overridden per context. */
    const gravityOf = (s) => (typeof s !== 'number' || s <= 0)
      ? { t: 'Unscored', c: '#94a3b8', off: 0, sub: '' }
      : s <= 4 ? { t: 'Critical', c: '#dc2626', off: Math.round((10 - s) / 10 * 100), sub: 'Burning budget: the wrong people click and the right buyer scrolls past.' }
      : s <= 6 ? { t: 'Weak', c: '#b45309', off: Math.round((10 - s) / 10 * 100), sub: 'Leaking spend: the funnel pulls the wrong buyer or loses the right one.' }
      : s <= 8 ? { t: 'Solid', c: '#0a66c2', off: Math.round((10 - s) / 10 * 100), sub: 'Working, with clear upside: a few fixes and it converts harder.' }
      : { t: 'Strong', c: '#075aad', off: Math.round((10 - s) / 10 * 100), sub: 'Dialed in: keep the spend here and scale it.' };
    const UrgencyMeter = ({ score, subline, dense, offOverride, label, color, headline, bigStat, bigUnit, bigCaption }) => {
      const g = gravityOf(score);
      const c = color || g.c;
      const has = typeof score === 'number' && score > 0;
      const fill = (typeof offOverride === 'number') ? offOverride : g.off;
      const t = label || g.t;
      const [w, setW] = useState(0);
      useEffect(() => { const tt = setTimeout(() => setW(fill), 180); return () => clearTimeout(tt); }, [fill]);
      const showBig = typeof bigStat === 'number';
      return (
        // Clean white card with the severity color as a precise ACCENT (pill + figure + bar),
        // not a filled red box. Matches the AdRoast homepage aesthetic; red stays reserved.
        <div className="rounded-2xl border bg-white" style={{ borderColor: '#e8ecf1', padding: dense ? '14px 16px' : '18px 20px' }}>
          <div className="flex items-center gap-2" style={{ marginBottom: headline ? 10 : 12 }}>
            <span className="inline-flex items-center gap-1.5 rounded-full" style={{ padding: '3px 10px', background: c + '14', color: c, fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
              <span style={{ width: 6, height: 6, borderRadius: 99, background: c }} />{t}
            </span>
            {has && !label && <span className="font-semibold text-gray-400" style={{ fontSize: 12 }}>{score}/10</span>}
          </div>
          {headline && <div className="text-gray-800" style={{ fontSize: 'clamp(15px,2.2vw,17px)', fontWeight: 600, lineHeight: 1.35, marginBottom: showBig ? 14 : 10 }}>{headline}</div>}
          {showBig ? (
            <div>
              <div className="flex items-baseline gap-2 mb-2.5">
                <span className="leading-none" style={{ color: c, fontSize: 'clamp(26px,5vw,32px)', fontWeight: 700, letterSpacing: '-0.02em' }}><CountUp to={bigStat} dur={1200} />{bigUnit || ''}</span>
                {bigCaption && <span className="text-gray-400" style={{ fontSize: 12.5, fontWeight: 500 }}>{bigCaption}</span>}
              </div>
              <div className="relative rounded-full overflow-hidden" style={{ height: 6, background: '#eef1f5' }}>
                <div style={{ width: w + '%', height: '100%', borderRadius: 99, background: c, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)' }} />
              </div>
              {(subline || (!label && g.sub)) && <p className="text-gray-500" style={{ fontSize: 12.5, lineHeight: 1.5, marginTop: 12 }}>{subline || g.sub}</p>}
            </div>
          ) : (<>
            <div className="relative rounded-full overflow-hidden" style={{ height: dense ? 6 : 8, background: '#eef1f5' }}>
              <div style={{ width: w + '%', height: '100%', borderRadius: 99, background: c, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)' }} />
            </div>
            {(subline || (!label && g.sub)) && <p className="text-gray-500" style={{ fontSize: dense ? 12 : 13, lineHeight: 1.5, marginTop: 10 }}>{subline || g.sub}</p>}
          </>)}
        </div>
      );
    };
    /* Money-at-stake framing derived honestly from the 0-10 score: the off-target
       share of spend = (10-score)*10%. Plain-language headline per gravity tier. */
    const stakeOf = (s) => {
      const off = (typeof s === 'number' && s > 0) ? Math.round((10 - s)) * 10 : 0;
      const head = (typeof s !== 'number' || s <= 0) ? ''
        : s <= 4 ? "You're paying for clicks that will never convert."
        : s <= 6 ? "Good budget is leaking on the wrong audience."
        : s <= 8 ? "Most of your spend works, some is slipping."
        : "Your spend is landing where it should.";
      return { off, head };
    };

    /* Animated circular score gauge. Arc sweeps to the score and the number
       counts up. Grey "N/A" when no score (e.g. no landing page provided). */
    const ScoreRing = ({ score, label, grade, big = false }) => {
      const has = typeof score === 'number' && score > 0;
      const size = big ? 132 : 108;
      const stroke = big ? 13 : 11;
      const r = (size - stroke - 2) / 2;
      const circ = 2 * Math.PI * r;
      const [off, setOff] = useState(circ);
      useEffect(() => {
        const t = setTimeout(() => setOff(circ - circ * (has ? score / 10 : 0)), 140);
        return () => clearTimeout(t);
      }, [circ, score, has]);
      const col = hexForScore(has ? score : null);
      return (
        <div className="flex flex-col items-center w-full min-w-0">
          <div style={{ position: 'relative', width: size, height: size }}>
            <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
              <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#eef2f7" strokeWidth={stroke} />
              <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth={stroke} strokeLinecap="round"
                strokeDasharray={circ} strokeDashoffset={off}
                style={{ transition: 'stroke-dashoffset 1.15s cubic-bezier(.22,1,.36,1)' }} />
            </svg>
            <div style={{ position: 'absolute', inset: 0 }} className="flex flex-col items-center justify-center">
              {has
                ? <span className="font-extrabold leading-none" style={{ fontSize: big ? 46 : 38, color: col }}><CountUp to={score} dur={1150} /></span>
                : <span className="font-bold text-gray-300" style={{ fontSize: big ? 28 : 24 }}>N/A</span>}
              {has && <span className="text-[10px] font-medium text-gray-400 mt-0.5">out of 10</span>}
            </div>
          </div>
          <div className="text-xs sm:text-sm font-bold text-gray-800 mt-3 text-center leading-tight break-words w-full px-0.5">{label}</div>
          {grade && <div className="text-xs font-bold mt-0.5 text-center" style={{ color: hexForScore(score) }}>{grade}</div>}
        </div>
      );
    };

    /* Semicircular "conversion health" gauge for the overall score - red/amber/green
       zones (severity only) with a needle at the score and a digital readout beneath. */
    const HealthGauge = ({ score }) => {
      const has = typeof score === 'number' && score > 0;
      const R = 88, cx = 110, cy = 110, sw = 15;
      const pt = (fr) => { const t = Math.PI - fr * Math.PI; return [cx + R * Math.cos(t), cy - R * Math.sin(t)]; };
      const arc = (a, b) => { const [x0, y0] = pt(a), [x1, y1] = pt(b); return `M${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`; };
      const f = has ? Math.min(1, score / 10) : 0;
      const [nf, setNf] = useState(0);
      useEffect(() => { const t = setTimeout(() => setNf(f), 160); return () => clearTimeout(t); }, [f]);
      const col = hexForScore(has ? score : null);
      const nt = Math.PI - nf * Math.PI;
      const nx = cx + (R - 10) * Math.cos(nt), ny = cy - (R - 10) * Math.sin(nt);
      return (
        <div className="flex flex-col items-center">
          <svg width="210" height="116" viewBox="0 0 220 118" style={{ maxWidth: '100%' }}>
            <path d={arc(0, 0.29)} fill="none" stroke="#dc2626" strokeWidth={sw} strokeLinecap="round" />
            <path d={arc(0.31, 0.59)} fill="none" stroke="#f59e0b" strokeWidth={sw} />
            <path d={arc(0.61, 1)} fill="none" stroke="#16a34a" strokeWidth={sw} strokeLinecap="round" />
            <line x1={cx} y1={cy} x2={nx} y2={ny} stroke={col} strokeWidth="4" strokeLinecap="round" style={{ transition: 'all 1.1s cubic-bezier(.22,1,.36,1)' }} />
            <circle cx={cx} cy={cy} r="8" fill={col} />
            <circle cx={cx} cy={cy} r="3.5" fill="#fff" />
          </svg>
          <div className="flex items-baseline gap-1 -mt-1">
            {has
              ? <><span className="font-extrabold leading-none" style={{ fontSize: 42, color: col }}><CountUp to={score} dur={1150} /></span><span className="text-base font-bold text-gray-400">/10</span></>
              : <span className="font-bold text-gray-300 text-2xl">N/A</span>}
          </div>
          <div className="text-sm font-bold mt-0.5" style={{ color: col }}>{has ? scoreGrade(score) : ''}</div>
          <div className="text-[11px] font-semibold text-gray-400 uppercase tracking-wide mt-0.5">Conversion health</div>
        </div>
      );
    };

    /* Thin animated severity bar (fills to score×10% on mount). */
    const SeverityBar = ({ score, height = 7 }) => {
      const has = typeof score === 'number' && score > 0;
      const [w, setW] = useState(0);
      useEffect(() => { const t = setTimeout(() => setW(has ? score * 10 : 0), 140); return () => clearTimeout(t); }, [score, has]);
      return (
        <div className="rounded-full bg-gray-100 overflow-hidden w-full" style={{ height }}>
          <div style={{ width: w + '%', height: '100%', background: hexForScore(has ? score : null), borderRadius: 999, transition: 'width 1s cubic-bezier(.22,1,.36,1)' }} />
        </div>
      );
    };

    /* Mini animated bar with an explicit color (for the results overview cards). */
    const MiniBar = ({ pct, color, height = 5 }) => {
      const [w, setW] = useState(0);
      useEffect(() => { const t = setTimeout(() => setW(pct), 160); return () => clearTimeout(t); }, [pct]);
      return (
        <div className="rounded-full bg-gray-100 overflow-hidden w-full" style={{ height }}>
          <div style={{ width: w + '%', height: '100%', background: color, borderRadius: 999, transition: 'width 1s cubic-bezier(.22,1,.36,1)' }} />

    /* Icon per ad-issue category, so the section scans as a visual grid, not a text list. */
    const CATEGORY_ICON = { headline_clarity: 'fileText', cta_friction: 'zap', visual_copy_match: 'eye', benefit_specificity: 'target', trust_signals: 'shield' };
    /* Compact ad-issue card: category icon + big severity score + one-line reason + bar.
       No expand - the reason is a short fragment that reads at a glance. */
    /* Per-rank progressive disclosure engineered from the model's OWN words:
       the roast line is split on its first sentence boundary. The lead sentence
       is the card's verdict (always shown); "Go deeper" unlocks the rest of the
       SAME output as the deeper read. Nothing is fabricated - the deeper text is
       the tail of the original explanation. Single-sentence lines show no button. */
    const RankReveal = ({ text, accent = '#0a66c2', tint = '#eff6ff' }) => {
      const parts = React.useMemo(() => {
        const clean = (text || '').trim();
        const m = clean.match(/^(.*?[.!?…])\s+(.+)$/); // first sentence, then the rest (no lookbehind, all browsers)
        return m ? { lead: m[1], rest: m[2] } : { lead: clean, rest: '' };
      }, [text]);
      const [phase, setPhase] = useState('lead'); // 'lead' | 'loading' | 'open'
      const go = () => { setPhase('loading'); setTimeout(() => setPhase('open'), 360); };
      const open = phase === 'open';
      return (
        <div>
          <p className="text-sm text-gray-600" style={{ lineHeight: 1.5 }}>{parts.lead}</p>
          {parts.rest && phase === 'loading' && (
            <div className="flex items-center gap-1.5 mt-2.5">
              {[0, 1, 2].map(d => <span key={d} className="w-1.5 h-1.5 rounded-full dot-bounce" style={{ background: accent, animationDelay: (d * 0.14) + 's' }} />)}
              <span className="text-[11px] font-semibold" style={{ color: accent }}>Going deeper</span>
            </div>
          )}
          {parts.rest && open && (
            <div className="mt-2.5 rounded-lg p-2.5 pop-reveal" style={{ background: tint }}>
              <div className="text-[10px] font-bold uppercase tracking-wide mb-1 flex items-center gap-1" style={{ color: accent }}><Icon name="sparkles" className="w-3 h-3" /> The deeper read</div>
              <p className="text-sm text-gray-700" style={{ lineHeight: 1.5 }}>{parts.rest}</p>
              <button onClick={() => setPhase('lead')} className="mt-1.5 text-[11px] font-semibold text-gray-400 hover:text-gray-600 cursor-pointer">Show less</button>
            </div>
          )}
          {parts.rest && phase === 'lead' && (
            <button onClick={go} className="mt-2.5 inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-full transition-transform hover:scale-105 cursor-pointer" style={{ color: accent, background: tint }}>
              <Icon name="sparkles" className="w-3 h-3" /> Go deeper
            </button>
          )}
        </div>
      );
    };

    const IssueRow = ({ issue }) => {
      const col = hexForScore(issue.score);
      const tint = issue.score <= 3 ? '#fef2f2' : issue.score <= 6 ? '#fffbeb' : '#f0fdf4';
      return (
        <div className="rounded-xl border border-gray-200 bg-white p-4 card-pop" style={{ borderTopWidth: '3px', borderTopColor: col }}>
          <div className="flex items-center gap-3 mb-2.5">
            <span className="flex-shrink-0 w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: tint }}><Icon name={CATEGORY_ICON[issue.category] || 'alertCircle'} className="w-4 h-4" style={{ color: col }} /></span>
            <span className="flex-1 min-w-0 font-semibold text-sm text-gray-900 leading-tight">{issue.title}</span>
            <span className="text-2xl font-extrabold leading-none flex-shrink-0" style={{ color: col }}>{issue.score}</span>
          </div>
          <div className="mb-2.5"><SeverityBar score={issue.score} height={5} /></div>
          <RankReveal text={issue.explanation} accent={col} tint={tint} />
        </div>
      );
    };

    /* Word grade for the headline score, shown under the big ring. */
    const scoreGrade = (s) => (typeof s !== 'number') ? '' : s <= 2 ? 'Rough' : s <= 4 ? 'Needs work' : s <= 6 ? 'Middling' : s <= 8 ? 'Solid' : 'Best-in-class';

    /* Smooth-scroll to a report section by id (instant under reduced-motion so
       it also works in the preview pane). */
    const scrollToSection = (id) => {
      const el = document.getElementById(id);
      if (!el) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    };

    /* One-click copy line for Fix Kit rewrites. Shows a check for ~1.4s. */
    const CopyLine = ({ text, muted }) => {
      const [done, setDone] = useState(false);
      const doCopy = (e) => {
        e.preventDefault();
        try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (err) {}
        setDone(true); setTimeout(() => setDone(false), 1400);
      };
      return (

    /* Interactive action checklist with a live progress bar. */
    const NextSteps = ({ steps }) => {

      const pct = steps.length ? Math.round((checked.length / steps.length) * 100) : 0;

                    <span className="relative z-10 flex-shrink-0 w-10 h-10 rounded-full border-2 flex items-center justify-center text-sm font-extrabold transition-all"

                      {typeof s === 'string' ? (
                        <span className={"text-sm " + (on ? "text-gray-400 line-through" : "text-gray-700")}>{s}</span>

                        <span className={"block text-sm font-semibold mb-1 " + (on ? "text-gray-400 line-through" : "text-gray-900")}>{s.step}</span>

    const EMAIL_CONFIG = { service_id: 'service_ywioabe', template_id: 'template_gtqow85', public_key: '964Wa83HevoEa5KnS', notify_email: 'marina.kogan@adroast.in' };
    const PAYMENT_URL = 'https://wise.com/pay/r/Xo-phJ5xD_25pN0';

    const notifyCtaClick = async (leadLinkedIn, section, auditLink) => {

    /* ---- Booking flow: an email + LinkedIn capture that runs BEFORE Calendly ----
       Every "Book a call" / main CTA opens this instead of jumping straight to
       Calendly. We ask for their work email (always - it powers the auto-nudge to
       no-shows, since a non-booker never reaches Calendly's email step) plus their
       LinkedIn. If they already gave their LinkedIn earlier (results-page team
       review), openBooking() is called WITH it and we only ask for email. On

       (b) notify Marina immediately (even if they never book), then (c) show
       Calendly inline (pre-filled with their email) and watch for the booking. */
    const bookingBus = { open: () => {} };
    const openBooking = (prefillLinkedin) => bookingBus.open(prefillLinkedin);

    // Shared LinkedIn URL check (module scope so BookingFlow can use it too).
    const isValidLinkedIn = (url) => /^(https?:\/\/)?([\w-]+\.)?linkedin\.com\/in\/[\w%À-￿-]{2,150}\/?(\?[^\s]*)?$/i.test((url || '').trim());

    // Persist the lead so the daily sweep can auto-email anyone who filled the form but never booked.
    const recordBookingIntent = async (payload) => {
      try {
        await fetch('/api/lead', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'book-intent', ...payload })
